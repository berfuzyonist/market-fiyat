name: Bildirimler

# Telefon bildirimleri (ntfy): yeni afişler, yeni çoklu alım kampanyaları, takip listesindeki fırsatlar,
# sabah özeti. TR 00.00–07.59 arası gönderilmez; birikenler sabah gider.
# Konu adı yalnızca NTFY_TOPIC gizli ayarındadır. Ayar yoksa iş bildirim göndermeden biter.
on:
  # Veri ya da afiş her yayımlandığında hemen (yeni afiş, yeni kampanya, takipteki fiyat değişimi).
  # Bot itmeleri başka iş akışını tetiklemediği için 'workflow_run' kullanılır.
  workflow_run:
    workflows: ["Afişler", "Şok", "Migros", "BİM"]
    types: [completed]
  schedule:
    - cron: "7 6 * * *"    # TR 09.07: sabah özeti (gece biriken bildirimler de bu saatte gider)
  workflow_dispatch:
    inputs:
      ornek:
        description: "Her marketten en yeni afişi örnek bildirim olarak gönder"
        type: boolean
        default: false
permissions:
  contents: write
  issues: read
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Bildirimleri gönder
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/notify.py ${{ inputs.ornek && '--ornek' || '' }}
      - name: Durumu kaydet
        run: |
          [ -f data/notify-state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/notify-state.json "$RUNNER_TEMP/s.json"
          [ -f data/barcodes-user.json ] && cp data/barcodes-user.json "$RUNNER_TEMP/b.json" || true
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main && git reset --hard origin/main
            cp "$RUNNER_TEMP/s.json" data/notify-state.json
            [ -f "$RUNNER_TEMP/b.json" ] && cp "$RUNNER_TEMP/b.json" data/barcodes-user.json || true
            git add data/notify-state.json data/barcodes-user.json 2>/dev/null || git add data/notify-state.json
            git diff --cached --quiet && exit 0
            git commit -qm "bildirim durumu"
            git push origin HEAD:refs/heads/main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
