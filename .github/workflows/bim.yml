name: BİM
on:
  schedule:
    - cron: "23 5,13 * * *"   # aktüel, günde iki kez (TR 08:23, 16:23)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod"
        type: choice
        options: [aktuel]
permissions:
  contents: write
concurrency:
  group: bim-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Modu seç
        id: m
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE=aktuel
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Tarayıcıyı çalıştır
        id: collect
        run: python3 collector/collect.py bim ${{ steps.m.outputs.mode }}
      - name: Sonucu yayımla
        if: always() && github.ref == 'refs/heads/main' && steps.collect.outcome != 'skipped'
        run: bash scripts/publish-market-data.sh bim ${{ steps.m.outputs.mode }}
