name: Tek Ürün Fiyat Güncelleme

# Uygulamadaki "Fiyatı Güncelle" bağlantısı "[FİYAT GÜNCELLE]" başlıklı bir talep açar.
# Yalnızca depo sahibi/üyesi/katkıcısının talepleri işlenir. Ürün tek istekle
# marketin herkese açık kaynağından okunur; bütün katalog taranmaz.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  # Talepler sırayla işlenir; aynı ürün için arka arkaya gelen talepler
  # price-checks.json üzerinden 10 dakika içinde markete yeniden gönderilmez.
  group: single-product-price-update
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, '[FİYAT GÜNCELLE]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Ürünü kaynaktan kontrol et
        id: check
        env:
          # Kullanıcı metni yalnızca ortam değişkeniyle aktarılır; kabuk komutuna gömülmez.
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/update_one_product.py check "$RUNNER_TEMP/result.json"

      - name: Sonucu en güncel ana dala uygula ve yayımla
        id: publish
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/update_one_product.py apply "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/comment.md"
            git add data/price-checks.json data/migros.json data/sok.json data/bim.json
            for f in data/history-migros.json data/history-sok.json data/history-bim.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            if git diff --cached --quiet; then
              echo "Yayımlanacak değişiklik yok."
              exit 0
            fi
            git commit -m "Ürün fiyat kontrolü: #${ISSUE_NUMBER}"
            if git push origin HEAD:refs/heads/main; then
              echo "Yayımlandı (deneme $attempt)."
              exit 0
            fi
            echo "Ana dal değişti; en güncel hali üzerinde yeniden uygulanıyor."
            sleep $((attempt * 3))
          done
          echo "Yayımlanamadı: ana dal sürekli değişiyor." >&2
          exit 1

      - name: Sonucu talebe yaz
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHECK: ${{ steps.check.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          comment="$RUNNER_TEMP/comment.md"
          if [ "$CHECK" = "success" ] && [ "$PUBLISH" = "success" ] && [ -s "$comment" ]; then
            printf '\n[Çalıştırma kaydı](%s)\n' "$RUN_URL" >> "$comment"
            gh issue comment "$ISSUE_NUMBER" --body-file "$comment"
            gh issue close "$ISSUE_NUMBER"
          else
            printf '**İşlem tamamlanamadı.**\n\n- Kontrol adımı: %s\n- Yayımlama adımı: %s\n- Mevcut fiyatlar korunmuştur; doğrulanmamış fiyat yayımlanmadı.\n- Ayrıntı: [çalıştırma kaydı](%s)\n' \
              "$CHECK" "$PUBLISH" "$RUN_URL" > "$RUNNER_TEMP/fail.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/fail.md"
          fi
