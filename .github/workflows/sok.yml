name: Şok
on:
  schedule:
    - cron: "47 0,12 * * *" # tam tarama (TR 03:47 ve 15:47)
    - cron: "7,37 * * * *" # 30 dakikada bir indirimler
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod"
        type: choice
        options: [full, deals]
  push:
    branches-ignore: [main]
    paths: ["collector/**", "config.json", ".github/workflows/sok.yml"]
permissions:
  contents: write
concurrency:
  # Tam tarama ile indirim kontrolü birbirinin bekleyen çalıştırmasını ezmesin.
  group: sok-${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || (github.event.schedule == '47 0,12 * * *' && 'full') || 'deals' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Modu seç
        id: m
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && [ "${{ github.event.schedule }}" = "47 0,12 * * *" ] && MODE=full
          [ -z "$MODE" ] && MODE=deals
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Tarayıcıyı çalıştır
        id: collect
        run: python3 collector/collect.py sok ${{ steps.m.outputs.mode }}
      - name: Sonucu yayımla
        if: always() && github.ref == 'refs/heads/main' && steps.collect.outcome != 'skipped'
        run: bash scripts/publish-market-data.sh sok ${{ steps.m.outputs.mode }}
