name: Şok
on:
  schedule:
    - cron: "47 0,12 * * *" # tam tarama (TR 03:47 ve 15:47)
    - cron: "7,37 * * * *" # 30 dakikada bir indirimler
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod"
        type: choice
        options: [full, deals]
  push:
    branches-ignore: [main]
    paths: ["collector/**", "config.json", ".github/workflows/sok.yml"]
permissions:
  contents: write
concurrency:
  group: sok
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Modu seç
        id: m
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && [ "${{ github.event.schedule }}" = "47 0,12 * * *" ] && MODE=full
          [ -z "$MODE" ] && MODE=deals
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - run: python3 collector/collect.py sok ${{ steps.m.outputs.mode }}
      - name: Veriyi kaydet
        if: github.ref == 'refs/heads/main'
        run: bash scripts/publish-market-data.sh sok ${{ steps.m.outputs.mode }}
