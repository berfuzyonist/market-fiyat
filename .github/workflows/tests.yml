name: Collector tests
on:
  push:
    branches-ignore: [main]
    paths:
      - "collector/**"
      - "scripts/**"
      - "js/**"
      - "tests/**"
      - "config.json"
      - ".github/workflows/**"
      - "index.html"
      - "css/**"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.cjs"
      - "sw.js"
  pull_request:
    branches: [main]
    paths:
      - "collector/**"
      - "scripts/**"
      - "js/**"
      - "tests/**"
      - "config.json"
      - ".github/workflows/**"
      - "index.html"
      - "css/**"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.cjs"
      - "sw.js"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python sözdizimini denetle
        run: python -m py_compile collector/collect.py scripts/update_one_product.py scripts/pricehist.py scripts/datamerge.py scripts/health.py
      - name: Publisher shell sözdizimini denetle
        run: bash -n scripts/publish-market-data.sh
      - name: Python birim testleri
        run: python -m unittest discover -s tests -v
      - name: JavaScript testleri
        run: |
          node --check js/app.js && node --check js/core.js && node --check js/match.js && node --check js/basket.js && node --check js/alerts.js
          node --test tests/js/*.test.js
      - name: Derlenmiş site dosyaları güncel mi (css/tw.css, js/icons.js, sürüm etiketleri)
        run: |
          npm ci --no-audit --no-fund
          npm run -s build
          node --check js/icons.js && node --check sw.js
          if ! git diff --exit-code -- css/tw.css js/icons.js index.html; then
            echo "::error::Derlenmiş dosyalar güncel değil: 'npm run build' çalıştırıp sonucu ekleyin."
            exit 1
          fi
      - name: Yayımlanan JSON dosyalarını doğrula
        run: |
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob("data/*.json") + glob.glob("data/client/*.json")):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("ok", path)
          PY
