name: Migros
on:
  schedule:
    - cron: "17 0 * * *"   # gece tam tarama (TR 03:17)
    - cron: "37 * * * *"   # saat başı indirimler
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod"
        type: choice
        options: [full, deals]
permissions:
  contents: write
concurrency:
  # Tam tarama ile indirim kontrolü birbirinin bekleyen çalıştırmasını ezmesin.
  group: migros-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || (github.event.schedule == '17 0 * * *' && 'full') || 'deals' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Modu seç
        id: m
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && [ "${{ github.event.schedule }}" = "17 0 * * *" ] && MODE=full
          [ -z "$MODE" ] && MODE=deals
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Tarayıcıyı çalıştır
        id: collect
        run: python3 collector/collect.py migros ${{ steps.m.outputs.mode }}
      - name: Sonucu yayımla
        if: always() && github.ref == 'refs/heads/main' && steps.collect.outcome != 'skipped'
        run: bash scripts/publish-market-data.sh migros ${{ steps.m.outputs.mode }}
