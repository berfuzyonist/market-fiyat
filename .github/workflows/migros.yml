name: Migros
on:
  schedule:
    - cron: "17 0 * * *"   # gece tam tarama (TR 03:17)
    - cron: "37 * * * *"   # saat başı indirimler
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod"
        type: choice
        options: [full, deals]
  push:
    branches-ignore: [main]
    paths: ["collector/**", "config.json", ".github/workflows/migros.yml"]
permissions:
  contents: write
concurrency:
  group: migros
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Modu seç
        id: m
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && [ "${{ github.event.schedule }}" = "17 0 * * *" ] && MODE=full
          [ -z "$MODE" ] && MODE=deals
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - run: python3 collector/collect.py migros ${{ steps.m.outputs.mode }}
      - name: Veriyi kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data/migros.json data/status-migros.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Migros: ${{ steps.m.outputs.mode }}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep $((i * 10))
          done
          exit 1
