name: Fiyat topla
on:
  schedule:
    - cron: "17 4,10,16 * * *"   # Türkiye saatiyle 07:17, 13:17, 19:17
  workflow_dispatch:
  push:
    paths: ["collector/**", "config.json", ".github/workflows/collect.yml"]
permissions:
  contents: write
concurrency:
  group: collect-${{ github.ref }}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collector/collect.py
      - name: Veriyi kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Fiyat verisi güncellendi"
          git push
