name: Fiyat topla
on:
  schedule:
    - cron: "17 0 * * *"   # her gece, Türkiye saatiyle 03:17
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["collector/**", "config.json", ".github/workflows/collect.yml"]
permissions:
  contents: write
concurrency:
  group: collect-${{ github.ref }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: python3 collector/collect.py
      - name: Veriyi kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "Fiyat verisi güncellendi"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q
